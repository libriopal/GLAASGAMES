<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GLAASGAMES — 4D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05050a; color: #e8e8f0;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* The canvas handles its own gestures; stop the browser stealing them. */
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; padding: 10px 12px;
    /* Safe-area insets keep the panel clear of a notch or punch-hole camera. */
    padding-top: max(10px, env(safe-area-inset-top));
    padding-left: max(12px, env(safe-area-inset-left));
    background: linear-gradient(135deg, rgba(6,6,14,.82), rgba(6,6,14,.45));
    border-bottom-right-radius: 10px;
    backdrop-filter: blur(8px);
    pointer-events: none;
    max-width: min(78vw, 360px);
  }
  #hud h1 { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em; color: #7bdfff; font-weight: 600; }
  .row { display: flex; gap: 8px; white-space: nowrap; }
  .k { color: #7a7a92; min-width: 74px; }
  .v { color: #e8e8f0; }
  #digest { color: #9dff9d; }
  #adapter { color: #ffd48a; white-space: normal; }

  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 8px; padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    justify-content: center;
  }
  button {
    flex: 0 1 auto;
    font: inherit; color: #e8e8f0;
    background: rgba(28,28,44,.85); border: 1px solid rgba(140,140,190,.35);
    border-radius: 8px; padding: 10px 14px;
    /* 44px minimum touch target — anything smaller is a miss on a phone. */
    min-height: 44px; min-width: 84px;
    backdrop-filter: blur(8px);
  }
  button:active { background: rgba(60,60,96,.95); }

  #pad {
    position: fixed; left: 0; right: 0; bottom: 62px;
    bottom: calc(62px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; padding: 0 10px;
    pointer-events: none;
  }
  .cluster {
    display: grid; pointer-events: auto;
    grid-template-areas: ". u ." "l . r" ". d .";
    gap: 5px;
  }
  button.pad {
    /* 52px keeps every control above the ~44px minimum comfortable touch target,
       with the thumb clusters pushed to the screen edges where thumbs rest. */
    width: 52px; height: 52px; min-width: 0; min-height: 0;
    padding: 0; font-size: 13px; line-height: 1.1;
    background: rgba(24,24,40,.78); border-radius: 12px;
  }
  button.pad.wbtn {
    /* The w controls are the mechanic, so they are visually distinct from the
       three directions the player already understands. */
    background: rgba(60,30,74,.85); border-color: rgba(220,140,255,.5); color: #f0c8ff;
    font-size: 11px;
  }
  button.pad small { opacity: .65; font-size: 9px; }

  #hint b { color: #f0c8ff; }
  #hint {
    /* Clear of the pad, which rises from 62px to roughly 220px. Overlapping it
       printed the hint straight through the d-pad. */
    position: fixed; bottom: 232px; left: 0; right: 0; text-align: center;
    color: #6a6a86; font-size: 11px; pointer-events: none; padding: 0 12px;
  }

  #fatal {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: #0b0b14; padding: 24px; overflow: auto;
    padding-top: max(24px, env(safe-area-inset-top));
  }
  #fatal strong { color: #ff8f8f; font-size: 15px; display: block; margin-bottom: 10px; }
  #fatal pre { white-space: pre-wrap; color: #b9b9cc; font-size: 12px; }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <h1>GLAASGAMES · 4D</h1>
    <div class="row"><span class="k">fps</span><span class="v" id="fps">—</span></div>
    <div class="row"><span class="k">ticks</span><span class="v" id="ticks">0</span></div>
    <div class="row"><span class="k">entities</span><span class="v" id="entities">0</span></div>
    <div class="row"><span class="k">dropped</span><span class="v" id="dropped">0</span></div>
    <div class="row"><span class="k">collected</span><span class="v" id="score">—</span></div>
    <div class="row"><span class="k">time</span><span class="v" id="clock">0.0s</span></div>
    <div class="row"><span class="k">your w</span><span class="v" id="playerw">0.00</span></div>
    <div class="row"><span class="k">nearest</span><span class="v" id="nearest">—</span></div>
    <div class="row"><span class="k">state</span><span class="v" id="phase">—</span></div>
    <div class="row"><span class="k">mode</span><span class="v" id="mode">—</span></div>
    <div class="row"><span class="k">digest</span><span class="v" id="digest">—</span></div>
    <div class="row"><span class="k">gpu</span><span class="v" id="adapter">—</span></div>
  </div>

  <div id="hint">move with the pad · <b>ana/kata</b> travel through w · drag the view to orbit</div>

  <div id="pad">
    <div class="cluster" id="cluster-move">
      <button class="pad" id="pad-up"    style="grid-area:u">▲</button>
      <button class="pad" id="pad-left"  style="grid-area:l">◀</button>
      <button class="pad" id="pad-right" style="grid-area:r">▶</button>
      <button class="pad" id="pad-down"  style="grid-area:d">▼</button>
    </div>
    <div class="cluster" id="cluster-w">
      <button class="pad wbtn" id="pad-ana"  style="grid-area:u">ana<br><small>+w</small></button>
      <button class="pad" id="pad-rise" style="grid-area:l">up</button>
      <button class="pad" id="pad-fall" style="grid-area:r">dn</button>
      <button class="pad wbtn" id="pad-kata" style="grid-area:d">kata<br><small>−w</small></button>
    </div>
  </div>

  <div id="controls">
    <button id="btn-spin">spin</button>
    <button id="btn-mode">project/slice</button>
    <button id="btn-reset">reset</button>
  </div>

  <div id="fatal"></div>

  <script type="module" src="/web/dist/web/main.js"></script>
</body>
</html>
