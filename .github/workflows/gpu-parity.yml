# GPU parity — executes the WGSL simulation kernel and proves it bit-identical
# to the TypeScript reference executor.
#
# WHY THIS EXISTS: the phone this repo is developed on has no WebGPU adapter, so
# engine/gpu/shaders/sim.wgsl cannot be executed there. Without this workflow the
# shader would ship on the strength of code review alone — and a fixed-point port
# with hand-assembled 64-bit arithmetic is precisely the kind of code that reads
# correct and computes wrong.
#
# WHY IT IS FREE: no GPU is rented. Mesa's lavapipe provides a software Vulkan
# device, and Deno's native WebGPU (wgpu) binds to it. GitHub's standard hosted
# runners are enough. This is a real execution of the real kernel, not a mock.
#
# WHAT IT DOES AND DOES NOT PROVE:
#   Proves    — the WGSL is correct: the limb multiply, the restoring sqrt over a
#               hi/lo pair, the long division and the boundary response all agree
#               with the reference bit for bit, across every tick.
#   Does not  — cross-vendor agreement on real NVIDIA/AMD/Intel/Apple silicon.
#               The engine is integer-only specifically so that vendor divergence
#               cannot arise, but that is an argument, not a measurement. Run the
#               same command on real hardware to measure it.

name: gpu-parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-tools

      - name: Confirm a Vulkan device exists
        run: |
          # Fail here rather than later with a confusing "no adapter" message.
          vulkaninfo --summary | grep -E 'deviceName|driverName'
          vulkaninfo --summary | grep -q 'llvmpipe' \
            || { echo "::error::lavapipe not present — WebGPU will find no adapter"; exit 1; }

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # verify-app and verify-gl2 drive a real browser: one plays a round by
      # clicking the staged APK page, the other executes the WebGL2 renderer that
      # actually ships. Both need a Chromium, and both FAIL rather than skip when
      # one is missing, so it is installed here rather than left to chance.
      - name: Install Chromium for the browser oracles
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Engine suite (CPU + browser)
        run: npm run verify:engine

      - name: Browser host builds
        run: npm run build:web

      # The parity pass runs under Deno rather than Node because Deno implements
      # WebGPU natively; Node needs a separate Dawn binding. --require-gpu turns a
      # missing adapter from a skip into a failure, which is the whole point of
      # running here: on the phone a skip is honest, in CI it would be a lie.
      #
      # --unstable-sloppy-imports lets Deno resolve the repo's ".js" specifiers to
      # their ".ts" sources, matching the tsconfig's bundler resolution.
      - name: GPU parity (WGSL executed on lavapipe)
        run: deno run --allow-all --unstable-sloppy-imports engine/verify/verify-parity.ts --require-gpu

      # Same reasoning as the parity step: Deno has native WebGPU, and the render
      # target here is an offscreen texture rather than a canvas, so no
      # compositor is involved and a headless runner can prove it draws.
      - name: Render verification (render.wgsl executed on lavapipe)
        run: deno run --allow-all --unstable-sloppy-imports engine/verify/verify-render.ts --require-gpu

      - name: GLASSBOX governance suite
        run: |
          npm run verify:genome && npm run verify:expression && npm run verify:telemetry
          npm run verify:harvest && npm run verify:corpus && npm run verify:fitness
          npm run verify:gates && npm run verify:kot && npm run verify:determinism
          npm run verify:branch-a && npm run verify:breeder && npm run verify:economy
          npm run verify:suite

      - name: Secrets scans
        run: npm run verify:no-secrets && npm run verify:no-prod-credentials-local

  # The Android build is the deliverable, so it is built on every push rather
  # than only when someone remembers to. It runs as a separate job because it
  # needs the Android SDK and nothing in the parity job does.
  #
  # This proves the APK still ASSEMBLES. It does not prove it runs: GitHub's
  # hosted runners have no KVM, so no emulator can boot, and an APK that builds
  # is not an APK that works. Installing it on a real device remains the test.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Compile the hosts and stage the app assets
        run: npm run build:web && npm run build:app-assets

      # Unsigned: the release keystore is not in CI and must never be. This job
      # answers "does it build", and signing is a separate concern handled on a
      # machine that holds the key.
      # ./gradlew, not the runner's gradle. The runner ships Gradle 9.7, and
      # AGP 8.13 relies on an internal API removed in 9.6 — so the system gradle
      # builds fine locally on 8.14 and fails here. The committed wrapper pins
      # one version for every machine, which is what a wrapper is for.
      - name: Assemble the debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Check what the APK actually contains
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt2

          # targetSdk must stay at 36: from 31 August 2026 Play blocks anything
          # lower, and a silent downgrade would not be noticed until submission.
          "$AAPT" dump badging "$APK" | grep -q "targetSdkVersion:'36'" \
            || { echo "::error::APK does not target API 36"; exit 1; }

          # NO platform permissions at all — an allowlist, not a denylist.
          #
          # This is the load-bearing claim behind the Data Safety declaration and
          # the Minimum Functionality argument, so it is asserted on the BUILT
          # ARTIFACT rather than read off the source manifest. That distinction
          # is the whole point: Gradle's manifest merger folds in permissions
          # declared by any dependency's own manifest, so a source manifest with
          # no <uses-permission> can still produce an APK that requests several.
          # Adding one analytics or crash-reporting library is enough.
          #
          # Denying INTERNET alone would miss that. Anything under the
          # android.permission namespace fails the build, and adding one has to
          # be a deliberate edit here. (The AndroidX self-permission for dynamic
          # receivers is app-scoped, not android.permission.*, so it does not
          # match — verified against a real build.)
          FOUND=$("$AAPT" dump permissions "$APK" | grep -o "android\.permission\.[A-Z_]*" | sort -u || true)
          if [ -n "$FOUND" ]; then
            echo "::error::APK requests platform permissions, so it is no longer offline-by-construction:"
            echo "$FOUND"
            exit 1
          fi

          # No native libraries, so the 16 KB page-size requirement is satisfied
          # by having nothing that could violate it.
          if unzip -l "$APK" | grep -q '\.so$'; then
            echo "::error::APK contains native libraries — check 16 KB page alignment"
            exit 1
          fi

          echo "APK: targets 36, no INTERNET, no native libraries"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
