org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# The app has no native code of its own, so the 16 KB page-size requirement that
# applies to apps targeting Android 15+ is satisfied by having no .so files to
# misalign. Keeping it explicit so nobody adds one without noticing.
android.nonTransitiveRClass=true
